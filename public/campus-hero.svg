<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none">
  <defs>
    <linearGradient id="sky" x1="320" y1="0" x2="320" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F83D8"/>
      <stop offset="1" stop-color="#8ED7F2"/>
    </linearGradient>
    <linearGradient id="building" x1="315" y1="150" x2="315" y2="385" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5FAFF"/>
      <stop offset="1" stop-color="#C6DFF4"/>
    </linearGradient>
    <style>
      .cloud { animation: drift 12s ease-in-out infinite alternate; }
      .cloud.late { animation-delay: -6s; }
      .sparkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .sparkle.late { animation-delay: -1.2s; }
      .flag { animation: wave 1.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
      .student { animation: bob 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .student.late { animation-delay: -1.4s; }
      @keyframes drift { to { transform: translateX(24px); } }
      @keyframes twinkle { 50% { opacity: .35; transform: scale(.72); } }
      @keyframes wave { to { transform: rotate(-10deg); } }
      @keyframes bob { 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </defs>
